<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt-to-Playable</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: rgba(15, 23, 42, 0.92);
        --border: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --ok: #4ade80;
        --bad: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      #app {
        display: grid;
        grid-template-columns: 1fr 320px;
        grid-template-rows: 1fr auto;
        height: 100vh;
        gap: 8px;
        padding: 8px;
      }
      #stage {
        position: relative;
        grid-column: 1;
        grid-row: 1;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        background: #05070f;
      }
      #controls {
        position: absolute;
        left: 10px;
        bottom: 10px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: var(--muted);
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--border);
        pointer-events: none;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
      }
      #badge {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        background: rgba(148, 163, 184, 0.18);
        color: var(--muted);
        border: 1px solid var(--border);
      }
      #badge.validated {
        background: rgba(74, 222, 128, 0.16);
        color: var(--ok);
        border-color: rgba(74, 222, 128, 0.5);
      }
      #hud {
        grid-column: 2;
        grid-row: 1 / span 2;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        padding: 14px;
        overflow-y: auto;
      }
      #chat {
        grid-column: 1;
        grid-row: 2;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #chat-log {
        max-height: 150px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        padding: 10px;
        font-size: 14px;
      }
      #chat-log .line {
        margin: 2px 0;
        white-space: pre-wrap;
      }
      #chat-log .line.user {
        color: var(--accent);
      }
      #chat-log .line.system {
        color: var(--muted);
      }
      #chat-log .line.error {
        color: var(--bad);
      }
      #chat-form {
        display: flex;
        gap: 8px;
      }
      #chat-input {
        flex: 1;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #020617;
        color: var(--text);
        font-size: 15px;
      }
      #chat-input:focus {
        outline: 2px solid var(--accent);
      }
      button {
        padding: 10px 16px;
        border-radius: 8px;
        border: none;
        background: var(--accent);
        color: #04121f;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: progress;
      }
      .hud-title {
        font-size: 16px;
        font-weight: 700;
        margin: 0 0 4px;
      }
      .hud-sub {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 12px;
      }
      .hud-meta {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 12px;
      }
      ul.objectives {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      ul.objectives li {
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      li.objective.active {
        border-color: rgba(56, 189, 248, 0.5);
      }
      li.objective.done {
        border-color: rgba(74, 222, 128, 0.5);
        color: var(--ok);
      }
      li.objective.failed {
        border-color: rgba(248, 113, 113, 0.5);
        color: var(--bad);
      }
      .progress {
        color: var(--muted);
        white-space: nowrap;
      }
      .banner {
        margin-top: 14px;
        padding: 12px;
        border-radius: 8px;
        text-align: center;
        font-weight: 700;
      }
      .banner.won {
        background: rgba(74, 222, 128, 0.18);
        color: var(--ok);
      }
      .banner.lost {
        background: rgba(248, 113, 113, 0.18);
        color: var(--bad);
      }
      .hud-empty {
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="game"></canvas>
        <span id="badge">unvalidated</span>
        <span id="controls">WASD move · Space jump · E interact</span>
      </div>
      <aside id="hud"></aside>
      <section id="chat">
        <div id="chat-log" aria-live="polite"></div>
        <form id="chat-form" autocomplete="off">
          <input
            id="chat-input"
            type="text"
            placeholder="Describe a game…"
            aria-label="Describe a game"
          />
          <button id="chat-submit" type="submit">Send</button>
        </form>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
